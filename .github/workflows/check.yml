name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest ruff jsonschema
      - name: Lint (ruff check)
        run: ruff check scripts/ tests/ perf-optimization/scripts/ perf-optimization/tests/
      - name: Format (ruff format --check)
        run: ruff format --check scripts/ tests/ perf-optimization/scripts/ perf-optimization/tests/
      - name: Test (pytest)
        run: python3 -m pytest tests/ perf-optimization/tests/ -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install .
      - name: Console scripts smoke
        run: |
          perf-benchmark --help
          perf-verify-win --help
          perf-select-candidate --help
      - name: Installer smoke (runtime-only payload)
        run: |
          bash bootstrap/install-perf.sh --dest /tmp/skills-smoke
          test -f /tmp/skills-smoke/perf-benchmark/SKILL.md
          test ! -e /tmp/skills-smoke/perf-optimization
          test ! -e /tmp/skills-smoke/perf-benchmark/tests
